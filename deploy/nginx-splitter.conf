# Paste inside the existing `server { ... }` block for glbadmin.thinkpro.academy.
# If that block's auth_basic sits inside its own `location /` rather than at
# server level, copy the auth_basic + auth_basic_user_file lines in here too,
# otherwise /splitter would be open to anyone.
location = /splitter { return 301 /splitter/; }

location /splitter/ {
    proxy_pass http://127.0.0.1:5055/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /splitter;

    # Decks arrive in 32 MB chunks (Cloudflare caps a request at 100 MB).
    client_max_body_size 64m;
    proxy_request_buffering off;
    # Large downloads (the zip can be hundreds of MB).
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
